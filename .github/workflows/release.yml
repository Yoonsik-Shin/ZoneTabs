name: Release

# master에 푸시할 때마다 앱을 빌드해서 릴리스에 ZoneTabs.dmg를 올린다.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build app (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh

      - name: Create dmg
        run: |
          mkdir staging
          cp -R build/ZoneTabs.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname ZoneTabs -srcfolder staging -ov -format UDZO ZoneTabs.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" ZoneTabs.dmg \
            --title "ZoneTabs $VERSION" \
            --generate-notes
