name: Release

# master에 푸시할 때마다 앱을 빌드해서 릴리스에 ZoneTabs.dmg를 올린다.
on:
  push:
    branches: [master]
    # 문서만 바꿨을 때는 새 릴리스를 만들지 않는다.
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      # 저장소에 서명 인증서가 등록돼 있으면 가져온다(scripts/setup-signing.sh 참고).
      # 없으면 이 단계는 아무것도 하지 않고, 빌드는 임시 서명으로 진행된다.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing certificate configured; using ad-hoc signature."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-certificate -c "ZoneTabs Self-Signed" -Z "$KEYCHAIN" | awk '/SHA-1/ {print $NF}')"
          # 자체 서명 인증서는 신뢰 설정이 없으면 codesign이 거부할 수 있다. 시험 서명이 실패하면 신뢰를 추가한다.
          cp /bin/ls "$RUNNER_TEMP/sign-test"
          if ! codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" "$RUNNER_TEMP/sign-test"; then
            security find-certificate -c "ZoneTabs Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" "$RUNNER_TEMP/sign-test"
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build app (Apple Silicon + Intel)
        run: UNIVERSAL=1 bash build.sh

      - name: Create dmg
        run: |
          mkdir staging
          cp -R build/ZoneTabs.app staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname ZoneTabs -srcfolder staging -ov -format UDZO ZoneTabs.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" ZoneTabs.dmg \
            --title "ZoneTabs $VERSION" \
            --generate-notes
